
services:
  proxy:
    build:
      context: ./proxy
    container_name: transcendence-proxy-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    networks:
      - public
      - internal
    volumes:
      - proxy_certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: on-failure:5

  db:
    image: postgres:16
    container_name: transcendence-db-postgres
    env_file:
      - .env
    networks:
      - internal-db
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: on-failure:5

  adminer:
    image: adminer:4.8.1
    container_name: transcendence-adminer
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - internal-db
    environment:
      ADMINER_DEFAULT_SERVER: db
    restart: on-failure:5

  backend:
    container_name: transcendence-backend
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - internal
      - internal-db
    volumes:
      - ./uploads:/data/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:${BACKEND_PORT:-8080}/api/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: on-failure:5

  frontend:
    container_name: transcendence-frontend
    build: ./frontend
    env_file:
      - .env
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:${FRONTEND_PORT:-3000}/ || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: on-failure:5


volumes:
  proxy_certs:
    name: "proxy_certs"
  dbdata:
    name: "dbdata"

networks:
  public:
    name: "transcendence_public"
    driver: bridge
  internal:
    name: "transcendence_internal"
  internal-db:
    name: "transcendence_internal_db"
